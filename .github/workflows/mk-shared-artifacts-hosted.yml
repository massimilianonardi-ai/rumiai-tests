name: mk-shared-artifacts-hosted

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mk-shared-artifacts-hosted.yml
      - tests/rumiai-os/mk/shared-artifact-concurrency.test
      - tests/rumiai-os/mk/shared-artifact-maintenance.test
  workflow_dispatch:

jobs:
  auxiliary:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout current test suite
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: rumiai-tests

      - name: Checkout exact product revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: ec670644237079b6e809aa2efe95cba5ed853b92
          fetch-depth: 0
          path: rumiai-os

      - name: Provision managed Node.js
        shell: bash
        run: |
          cd rumiai-os
          ./m ./bin/sys/pkg install nodejs
          ./m ./bin/sys/pkg default nodejs

      - name: Run changed mk regressions
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./tests/rumiai-os/mk/shared-artifact-concurrency.test
          ./tests/rumiai-os/mk/shared-artifact-maintenance.test
