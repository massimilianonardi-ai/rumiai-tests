name: electron-web-control-package

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/electron-web-control-package.yml
      - validation/electron-web-control-package.conf
      - tests/external/electron-web-control/**
      - tests/rumiai-os/pkg/catalog.test
      - tests/rumiai-os/pkg/depend.test
      - tests/rumiai-os/pkg/install-dependency-order.test
      - tests/rumiai-os/pkg-repository-github/**
      - rumiai-validate
      - lib/sh/rumiai-validate.lib.sh
      - lib/rumiai-os-target.lib
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formal-validation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: linux-x86_64
          - runner: ubuntu-26.04-arm
            arch: linux-arm64
          - runner: macos-15-arm64
            arch: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout current test suite
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: rumiai-tests
          persist-credentials: true
      - name: Checkout product source/update point
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: main
          fetch-depth: 0
          path: rumiai-os
          persist-credentials: true
      - name: Normalize product origin
        shell: bash
        run: git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - name: Configure validation evidence author
        shell: bash
        run: |
          git -C rumiai-tests config user.name "github-actions[bot]"
          git -C rumiai-tests config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Validate real package, facility and service integration
        shell: bash
        run: |
          mkdir -p "$HOME/.rumiai-validation-tmp"
          export TMPDIR="$HOME/.rumiai-validation-tmp"
          if [ "$RUNNER_OS" = Linux ]
          then
            xvfb-run -a bash -c '
              cd rumiai-tests
              ./rumiai-validate electron-web-control-package
            '
          else
            cd rumiai-tests
            ./rumiai-validate electron-web-control-package
          fi
      - name: Upload recoverable validation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: electron-web-control-package-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rumiai-tests/sessions
            rumiai-tests/validations
          if-no-files-found: ignore
          include-hidden-files: true
