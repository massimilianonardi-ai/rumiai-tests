name: native-command-managed-node

on:
  push:
    branches:
      - m-native-command-tests
    paths:
      - .github/workflows/native-command-managed-node.yml
      - tests/rumiai-os/pkg-launch/managed-node.test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-node:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout staged tests
        uses: actions/checkout@v4
        with:
          path: rumiai-tests
          persist-credentials: false
      - name: Checkout staged runtime
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 59d5ec2d78494c126d5c2869b5b01076e735a6ab
          path: rumiai-os
          persist-credentials: false
      - name: Checkout staged catalog
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: 893120694670ac91e67353797ca3602d8f2b330b
          path: pkg-catalog
          persist-credentials: false
      - name: Prepare exact staged catalog and native environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rumiai-tests rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C rumiai-os rev-parse HEAD)" = 59d5ec2d78494c126d5c2869b5b01076e735a6ab
          test "$(git -C pkg-catalog rev-parse HEAD)" = 893120694670ac91e67353797ca3602d8f2b330b
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          # Give local Git transport a branch HEAD that points at the exact staged snapshot.
          git -C pkg-catalog switch -c native-command-validated
          ./rumiai-os/m osarch update
          catalog_conf="$(./rumiai-os/m state-path system sys pkg conf)"
          mkdir -p "$catalog_conf"
          printf 'file://%s/pkg-catalog\n' "$GITHUB_WORKSPACE" > "$catalog_conf/catalog"
          echo "expected-catalog=$(git -C pkg-catalog rev-parse HEAD)"
          echo "catalog-source=$(cat "$catalog_conf/catalog")"
          ./rumiai-os/m osarch
      - name: Install Node.js through the real staged pkg catalog
        shell: bash
        run: |
          set -euo pipefail
          ./rumiai-os/m pkg install 'nodejs@v26.8.2'
          ./rumiai-os/m pkg default 'nodejs@v26.8.2'
          ./rumiai-os/m pkg default nodejs
          ./rumiai-os/m node --version
      - name: Prove managed Node execution and run mk and jsc tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          set -euo pipefail
          cd rumiai-tests
          ./rumiai-test rumiai-os/pkg-launch/managed-node.test
          ./rumiai-test rumiai-os/mk/lifecycle.test
          ./rumiai-test rumiai-os/jsc/compiler-loader.test
      - name: Reinstall exact managed Node concrete while preserving state
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/rumiai-os"
          user_conf="$("$root/m" state-path user pkg nodejs conf)"
          user_home="$("$root/m" state-path user pkg nodejs home)"
          system_conf="$("$root/m" state-path system pkg nodejs conf)"
          mkdir -p "$user_conf/.m" "$user_home" "$system_conf"
          printf 'MIGRATION_USER_SENTINEL=preserved\nexport MIGRATION_USER_SENTINEL\n' > "$user_conf/.m/env"
          printf 'persistent-home\n' > "$user_home/native-migration-sentinel"
          printf 'persistent-system\n' > "$system_conf/native-migration-sentinel"
          recorded="$("$root/m" pkg default nodejs)"
          expected="nodejs@v26.8.2!$("$root/m" osarch)"
          printf 'migration-recorded=%s expected=%s\n' "$recorded" "$expected"
          test "$recorded" = "$expected"
          "$root/m" pkg uninstall "$recorded"
          if "$root/m" pkg default nodejs >/dev/null 2>&1; then
            echo "Default survived explicit uninstall" >&2
            exit 1
          fi
          test "$(cat "$user_home/native-migration-sentinel")" = persistent-home
          test "$(cat "$system_conf/native-migration-sentinel")" = persistent-system
          "$root/m" pkg install "$recorded"
          "$root/m" pkg default "$recorded"
          test "$("$root/m" pkg default nodejs)" = "$recorded"
          "$root/m" node -e '
            if (process.env.MIGRATION_USER_SENTINEL !== "preserved") process.exit(51);
            console.log("reinstalled-managed-node="+process.execPath);
          '
          test "$(cat "$user_home/native-migration-sentinel")" = persistent-home
          test "$(cat "$system_conf/native-migration-sentinel")" = persistent-system

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          find rumiai-tests/.runs -type f -name '*.log' -print 2>/dev/null | while IFS= read -r f; do
            case "$f" in *managed-node*|*mk*|*jsc*) echo "---- $f"; tail -n 100 "$f";; esac
          done
          true
      - name: Upload revision-specific runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-managed-node-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: rumiai-tests/.runs
          include-hidden-files: true
          if-no-files-found: ignore
