name: Provider model validation

on:
  push:
    branches:
      - validation/provider-model-20260918

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: e934fcfb09e32d7d4eef10a913161fb0d51939be
          path: target
      - name: Normalize product origin
        shell: bash
        run: git -C target remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: d73bd9b2e45f522dd6895ebe78e4d4f64b2a94c2
          path: target/src/rumiai-tests
      - name: Run provider model tests
        shell: bash
        run: |
          set -eu
          cd target/src/rumiai-tests
          for test in             tests/rumiai-os/pkg/provider.test             tests/rumiai-os/pkg/dependency.test             tests/rumiai-os/pkg-launch/contract.test
          do
            echo "=== $test ==="
            "./$test"
          done
