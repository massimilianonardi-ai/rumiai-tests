name: Menu final bridge snapshot

on:
  push:
    branches:
      - main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test suite
        uses: actions/checkout@v4
        with:
          ref: 6a493062f315952c8fd63502ce4521b3e5ae5e98
          fetch-depth: 1
          path: rumiai-tests
      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 1f4a4a8b62ed41042e4178b11f74f54ad291aadb
          fetch-depth: 1
          path: rumiai-os
      - name: Normalize and verify exact checkouts
        shell: bash
        run: |
          set -euo pipefail
          git -C rumiai-tests remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          test "$(git -C rumiai-tests rev-parse HEAD)" = "6a493062f315952c8fd63502ce4521b3e5ae5e98"
          test "$(git -C rumiai-os rev-parse HEAD)" = "1f4a4a8b62ed41042e4178b11f74f54ad291aadb"
          test -z "$(git -C rumiai-tests status --porcelain --untracked-files=no)"
          test -z "$(git -C rumiai-os status --porcelain --untracked-files=no)"
      - name: Package exact checkouts
        shell: bash
        run: |
          set -euo pipefail
          tests_name="rumiai-tests-6a493062f315952c8fd63502ce4521b3e5ae5e98.tar.gz"
          os_name="rumiai-os-1f4a4a8b62ed41042e4178b11f74f54ad291aadb.tar.gz"
          tests_archive="$RUNNER_TEMP/$tests_name"
          os_archive="$RUNNER_TEMP/$os_name"
          tar -C rumiai-tests -czf "$tests_archive" .
          tar -C rumiai-os -czf "$os_archive" .
          tests_digest="$(sha256sum "$tests_archive" | awk '{print $1}')"
          os_digest="$(sha256sum "$os_archive" | awk '{print $1}')"
          (cd "$RUNNER_TEMP" && printf '%s  %s\n' "$tests_digest" "$tests_name" > "$tests_name.sha256")
          (cd "$RUNNER_TEMP" && printf '%s  %s\n' "$os_digest" "$os_name" > "$os_name.sha256")
          {
            printf 'rumiai-tests-repository\t%s\n' 'massimilianonardi-ai/rumiai-tests'
            printf 'rumiai-tests-commit\t%s\n' '6a493062f315952c8fd63502ce4521b3e5ae5e98'
            printf 'rumiai-tests-origin\t%s\n' 'https://github.com/massimilianonardi-ai/rumiai-tests.git'
            printf 'rumiai-tests-archive\t%s\n' "$tests_name"
            printf 'rumiai-tests-sha256\t%s\n' "$tests_digest"
            printf 'rumiai-os-repository\t%s\n' 'massimilianonardi-ai/rumiai-os'
            printf 'rumiai-os-commit\t%s\n' '1f4a4a8b62ed41042e4178b11f74f54ad291aadb'
            printf 'rumiai-os-origin\t%s\n' 'https://github.com/massimilianonardi-ai/rumiai-os.git'
            printf 'rumiai-os-archive\t%s\n' "$os_name"
            printf 'rumiai-os-sha256\t%s\n' "$os_digest"
          } > "$RUNNER_TEMP/manifest"
      - uses: actions/upload-artifact@v4
        with:
          name: menu-final-bridge
          path: |
            ${{ runner.temp }}/rumiai-tests-6a493062f315952c8fd63502ce4521b3e5ae5e98.tar.gz
            ${{ runner.temp }}/rumiai-tests-6a493062f315952c8fd63502ce4521b3e5ae5e98.tar.gz.sha256
            ${{ runner.temp }}/rumiai-os-1f4a4a8b62ed41042e4178b11f74f54ad291aadb.tar.gz
            ${{ runner.temp }}/rumiai-os-1f4a4a8b62ed41042e4178b11f74f54ad291aadb.tar.gz.sha256
            ${{ runner.temp }}/manifest
          if-no-files-found: error
          compression-level: 0
