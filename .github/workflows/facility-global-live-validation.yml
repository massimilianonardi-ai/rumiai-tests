name: Facility global live validation

on:
  push:
    branches:
      - validation/facility-global-live-20260919

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - external/temurin/install-live.test
          - external/graalvm/install-live.test
          - external/graalvm/temurin-coexistence-live.test
          - external/maven/install-live.test
          - external/keycloak/install-live.test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 7e2a4bfe519ac3ee87dab9c820a50bbcdfa2303f
          path: target
      - name: Normalize product origin
        shell: bash
        run: git -C target remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 7273b6d304c0312046da91543effb00a93fec31e
          path: target/src/rumiai-tests
      - name: Assert catalog revision
        shell: bash
        run: |
          set -eu
          actual=$(git ls-remote https://github.com/massimilianonardi-ai/pkg-catalog.git refs/heads/main | awk '{print $1}')
          test "$actual" = bd06488d3c67160e820c04d13067f852c8861c32
      - name: Run permanent live test
        shell: bash
        run: |
          cd target/src/rumiai-tests
          "./tests/${{ matrix.test }}"

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            test: external/temurin/install-live.test
          - runner: macos-15-intel
            test: external/temurin/install-live.test
          - runner: macos-15
            test: external/graalvm/install-live.test
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 7e2a4bfe519ac3ee87dab9c820a50bbcdfa2303f
          path: target
      - name: Normalize product origin
        shell: bash
        run: git -C target remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 7273b6d304c0312046da91543effb00a93fec31e
          path: target/src/rumiai-tests
      - name: Assert catalog revision
        shell: bash
        run: |
          set -eu
          actual=$(git ls-remote https://github.com/massimilianonardi-ai/pkg-catalog.git refs/heads/main | awk '{print $1}')
          test "$actual" = bd06488d3c67160e820c04d13067f852c8861c32
      - name: Run permanent live test
        shell: bash
        run: |
          cd target/src/rumiai-tests
          "./tests/${{ matrix.test }}"
