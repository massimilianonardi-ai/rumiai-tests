name: rsudo-injection-validation

on:
  push:
    branches:
      - validation-rsudo-injection-20260929
    paths:
      - .github/workflows/rsudo-injection-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permanent-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout frozen test suite
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: ce64eab23d03fefc3b93eb2d6baf57d0e5ccd013
          fetch-depth: 1
          path: rumiai-tests
          persist-credentials: false

      - name: Checkout frozen product
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: a015fb27cd5862808bef3f7fe8b92b2b8e8e8169
          fetch-depth: 1
          path: rumiai-os
          persist-credentials: false

      - name: Normalize product origin
        shell: bash
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Verify frozen revisions
        shell: bash
        run: |
          test "$(git -C rumiai-tests rev-parse HEAD)" = "ce64eab23d03fefc3b93eb2d6baf57d0e5ccd013"
          test "$(git -C rumiai-os rev-parse HEAD)" = "a015fb27cd5862808bef3f7fe8b92b2b8e8e8169"

      - name: Run permanent tests with diagnostics
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          set +e
          overall=0
          for test_id in \
            rumiai-os/bootstrap/library-loading.test \
            rumiai-os/rsudo/exec-inject.test
          do
            echo "=== RUN $test_id ==="
            ./rumiai-test "$test_id"
            status=$?
            echo "=== STATUS $test_id: $status ==="
            find .runs -type f -path '*/logs/*.log' -print | LC_ALL=C sort | while IFS= read -r log
            do
              echo "--- $log ---"
              cat "$log"
            done
            rm -rf .runs
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"
