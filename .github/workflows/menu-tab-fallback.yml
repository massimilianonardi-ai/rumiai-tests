name: Menu Tab fallback development run

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test suite
        uses: actions/checkout@v4
        with:
          ref: 7f3100edee2fc3b0bef77314f8a9898f97d73314
          fetch-depth: 1
          path: rumiai-tests

      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 4e6de5ec0ace036262bb6016424e235c7bd9bdc0
          fetch-depth: 1
          path: rumiai-os

      - name: Verify exact revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rumiai-tests rev-parse HEAD)" = "7f3100edee2fc3b0bef77314f8a9898f97d73314"
          test "$(git -C rumiai-os rev-parse HEAD)" = "4e6de5ec0ace036262bb6016424e235c7bd9bdc0"

      - name: Run menu tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./rumiai-test rumiai-os/menu
