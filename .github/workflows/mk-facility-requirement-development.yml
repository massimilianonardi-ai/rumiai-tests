name: mk facility requirement development

on:
  push:
    paths:
      - '.github/workflows/mk-facility-requirement-development.yml'
  workflow_dispatch:

jobs:
  mk-facility-requirement:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: ab1fcf2c0b388f902c821ddf70809f4d651fb375
          path: rumiai-tests

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 29528c50a725b6639b6b3a2149b3598c9e058cdb
          path: rumiai-os

      - name: Normalize target origin
        shell: sh
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Run pkg requirement coverage
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          RUMIAI_OS_TARGET="$PWD/rumiai-os"
          export PATH RUMIAI_OS_TARGET
          cd rumiai-tests
          ./rumiai-test rumiai-os/pkg/dependency.test

      - name: Provision managed Node.js
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          export PATH
          cd rumiai-os
          ./m pkg install nodejs
          nodejs_version="$(./m pkg versions nodejs | sed -n '1p')"
          [ -n "$nodejs_version" ]
          ./m pkg default "$nodejs_version"

      - name: Run mk permanent tests
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          RUMIAI_OS_TARGET="$PWD/rumiai-os"
          export PATH RUMIAI_OS_TARGET
          cd rumiai-tests
          ./rumiai-test rumiai-os/mk/lifecycle.test
          ./rumiai-test rumiai-os/mk/refinement.test
          ./rumiai-test rumiai-os/mk/project-dependency.test
          ./rumiai-test rumiai-os/mk/requirement.test
