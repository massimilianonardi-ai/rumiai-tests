name: mk incremental freshness development

on:
  push:
    paths:
      - '.github/workflows/mk-incremental-development.yml'
  workflow_dispatch:

jobs:
  mk-incremental:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: f39f98135b704dd73f9bd97b63968a8a4b9016d3
          path: rumiai-tests

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 377f31b4fa8bed97c1a94558efd9acf53c4d2333
          path: rumiai-os

      - name: Normalize target origin
        shell: sh
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Provision managed Node.js
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          export PATH
          cd rumiai-os
          ./m pkg install nodejs
          nodejs_version="$(./m pkg versions nodejs | sed -n '1p')"
          [ -n "$nodejs_version" ]
          ./m pkg default "$nodejs_version"
          ./m node --check lib/sys/js/mk.lib.js

      - name: Diagnose new mk tests directly
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          RUMIAI_OS_TARGET="$PWD/rumiai-os"
          export PATH RUMIAI_OS_TARGET
          cd rumiai-tests
          ./tests/rumiai-os/mk/requirement.test
          ./tests/rumiai-os/mk/incremental.test
