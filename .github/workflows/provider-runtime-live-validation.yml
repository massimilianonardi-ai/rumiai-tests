name: Provider runtime live validation

on:
  push:
    branches:
      - validation/provider-runtime-live-20260918

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - external/temurin/install-live.test
          - external/graalvm/install-live.test
          - external/graalvm/temurin-coexistence-live.test
          - external/maven/install-live.test
          - external/keycloak/install-live.test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 384677c6acc9424fd4ce4eca7aa9aed104bded5d
          path: target
      - name: Normalize product origin
        shell: bash
        run: git -C target remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: d975a0fccc603505ed840cbd8b613a9cf73b7636
          path: target/src/rumiai-tests
      - name: Assert catalog revision
        shell: bash
        run: |
          set -eu
          actual=$(git ls-remote https://github.com/massimilianonardi-ai/pkg-catalog.git refs/heads/main | awk '{print $1}')
          test "$actual" = 43f1f5843cd90566322b829b9489afce332af8fc
      - name: Run permanent live test
        shell: bash
        run: |
          cd target/src/rumiai-tests
          "./tests/${{ matrix.test }}"

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            test: external/temurin/install-live.test
          - runner: macos-15-intel
            test: external/temurin/install-live.test
          - runner: macos-15
            test: external/graalvm/install-live.test
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 384677c6acc9424fd4ce4eca7aa9aed104bded5d
          path: target
      - name: Normalize product origin
        shell: bash
        run: git -C target remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: d975a0fccc603505ed840cbd8b613a9cf73b7636
          path: target/src/rumiai-tests
      - name: Assert catalog revision
        shell: bash
        run: |
          set -eu
          actual=$(git ls-remote https://github.com/massimilianonardi-ai/pkg-catalog.git refs/heads/main | awk '{print $1}')
          test "$actual" = 43f1f5843cd90566322b829b9489afce332af8fc
      - name: Run permanent live test
        shell: bash
        run: |
          cd target/src/rumiai-tests
          "./tests/${{ matrix.test }}"
