name: native-command-main-diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-command-main-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout published suite
        uses: actions/checkout@v4
        with:
          path: rumiai-tests
          persist-credentials: false
      - name: Checkout published runtime
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 673df1a2d5476ad57d54c7bc7e1fc2deeaf16195
          path: rumiai-os
          persist-credentials: false
      - name: Run native command regression with diagnostics
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          echo "runtime=$(git -C rumiai-os rev-parse HEAD)"
          echo "suite=$(git -C rumiai-tests rev-parse HEAD)"
          cd rumiai-tests
          ./rumiai-test rumiai-os/http-fetch/backends.test
      - name: Display test output from runner
        if: always()
        shell: bash
        run: |
          find rumiai-tests/.runs -type f -name '*.log' -print 2>/dev/null |
            while IFS= read -r f; do
              echo "==== $f"
              tail -n 70 "$f"
            done
          true
