name: Facility global projection smoke

on:
  push:
    branches:
      - validation/facility-global-smoke-20260919

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 7e2a4bfe519ac3ee87dab9c820a50bbcdfa2303f
          path: target
      - name: Normalize product origin
        shell: bash
        run: git -C target remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 322cee67192e38c828145325131c9fe6d0574c40
          path: target/src/rumiai-tests
      - name: Syntax check
        shell: bash
        run: |
          /bin/sh -n target/lib/sys/sh/pkg/pkg-provider.lib.sh
          /bin/sh -n target/lib/sys/sh/pkg/pkg-integration.lib.sh
      - name: Existing provider tests
        shell: bash
        run: |
          set -eu
          cd target/src/rumiai-tests
          ./tests/rumiai-os/pkg/provider.test
          ./tests/rumiai-os/pkg-launch/contract.test
