name: rsudo-apisix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rsudo-apisix.yml
      - validation/rsudo-apisix.conf
      - tests/rumiai-os/rsudo/apisix-mode.test
      - tests/rumiai-os/rsudo/apisix-parser-live.test
      - tests/rumiai-os/rsudo/apisix-runtime-live.test
      - tests/rumiai-os/rsudo/apisix-admin-read-live.test
      - tests/rumiai-os/rsudo/legacy-modules.test
      - rumiai-validate
      - rumiai-test
      - lib/rumiai-os-target.lib
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-product:
    runs-on: ubuntu-latest
    outputs:
      rumiai-os-commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Checkout current product head
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: main
          fetch-depth: 1
          path: rumiai-os
          persist-credentials: false
      - name: Freeze product revision
        id: revision
        shell: bash
        run: |
          echo "commit=$(git -C rumiai-os rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  focused-validation:
    needs: resolve-product
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout frozen test suite revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: rumiai-tests
          persist-credentials: true
      - name: Anchor frozen suite publication branch
        shell: bash
        run: |
          branch="validation-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.os }}"
          git -C rumiai-tests switch -c "$branch" "${GITHUB_SHA}"
          git -C rumiai-tests config "branch.$branch.remote" origin
          git -C rumiai-tests config "branch.$branch.merge" refs/heads/main
      - name: Checkout product source/update point
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: main
          fetch-depth: 0
          path: rumiai-os
          persist-credentials: true
      - name: Normalize product origin
        shell: bash
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - name: Configure validation evidence author
        shell: bash
        run: |
          git -C rumiai-tests config user.name "github-actions[bot]"
          git -C rumiai-tests config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Provision pinned Apache APISIX 3.16 and 3.19 parsers (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker pull apache/apisix@sha256:b921bdef3cfb2ca72e483d643f40e7843683ff8e188984489c2020f17654ee88
          docker pull apache/apisix@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
          docker image inspect --format '{{.Id}}' apache/apisix@sha256:b921bdef3cfb2ca72e483d643f40e7843683ff8e188984489c2020f17654ee88
          docker image inspect --format '{{.Id}}' apache/apisix@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141

      - name: Run scoped APISIX module verification
        shell: bash
        run: |
          cd rumiai-tests
          ./rumiai-validate \
            --no-suite-update \
            --rumiai-os-commit="${{ needs.resolve-product.outputs.rumiai-os-commit }}" \
            rsudo-apisix
      - name: Upload recoverable validation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rsudo-apisix-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rumiai-tests/sessions
            rumiai-tests/validations
          if-no-files-found: ignore
          include-hidden-files: true
