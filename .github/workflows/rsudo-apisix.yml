name: rsudo-apisix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rsudo-apisix.yml
      - validation/rsudo-apisix.conf
      - tests/rumiai-os/rsudo/apisix-mode.test
      - tests/rumiai-os/rsudo/apisix-parser-live.test
      - tests/rumiai-os/rsudo/apisix-runtime-live.test
      - tests/rumiai-os/rsudo/apisix-systemd-live.test
      - tests/rumiai-os/rsudo/apisix-systemd-apisix-live.test
      - tests/rumiai-os/rsudo/apisix-admin-read-live.test
      - tests/rumiai-os/rsudo/apisix-admin-etcd-live.test
      - tests/rumiai-os/rsudo/apisix-file-driven-live.test
      - tests/rumiai-os/rsudo/apisix-file-driven-convergence-live.test
      - tests/rumiai-os/rsudo/apisix-admin-transport.test
      - tests/rumiai-os/rsudo/apisix-admin-rsudo-ssh-live.test
      - tests/rumiai-os/rsudo/legacy-modules.test
      - rumiai-validate
      - rumiai-test
      - lib/rumiai-os-target.lib
  workflow_dispatch:
    inputs:
      rumiai_os_commit:
        description: Full rumiai-os commit SHA to validate (defaults to current main)
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-product:
    runs-on: ubuntu-latest
    outputs:
      rumiai-os-commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Checkout current product head
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: main
          fetch-depth: 1
          path: rumiai-os
          persist-credentials: false
      - name: Freeze product revision
        id: revision
        shell: bash
        env:
          REQUESTED_RUMIAI_OS_COMMIT: ${{ inputs.rumiai_os_commit }}
        run: |
          selected=$(git -C rumiai-os rev-parse HEAD)
          if [ -n "$REQUESTED_RUMIAI_OS_COMMIT" ]; then
            case "$REQUESTED_RUMIAI_OS_COMMIT" in
              *[!0-9a-f]*) echo 'requested rumiai-os commit must be a full lowercase SHA-1' >&2; exit 1 ;;
            esac
            [ "${#REQUESTED_RUMIAI_OS_COMMIT}" -eq 40 ] || {
              echo 'requested rumiai-os commit must be a full lowercase SHA-1' >&2
              exit 1
            }
            git -C rumiai-os fetch --no-tags origin "$REQUESTED_RUMIAI_OS_COMMIT"
            selected=$(git -C rumiai-os rev-parse FETCH_HEAD)
            [ "$selected" = "$REQUESTED_RUMIAI_OS_COMMIT" ] || {
              echo 'fetched rumiai-os commit does not match the requested SHA' >&2
              exit 1
            }
          fi
          echo "commit=$selected" >> "$GITHUB_OUTPUT"

  focused-validation:
    needs: resolve-product
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout frozen test suite revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: rumiai-tests
          persist-credentials: true
      - name: Anchor frozen suite publication branch
        shell: bash
        run: |
          branch="validation-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.os }}"
          git -C rumiai-tests switch -c "$branch" "${GITHUB_SHA}"
          git -C rumiai-tests config "branch.$branch.remote" origin
          git -C rumiai-tests config "branch.$branch.merge" refs/heads/main
      - name: Checkout product source/update point
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: main
          fetch-depth: 0
          path: rumiai-os
          persist-credentials: true
      - name: Normalize product origin
        shell: bash
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
      - name: Configure validation evidence author
        shell: bash
        run: |
          git -C rumiai-tests config user.name "github-actions[bot]"
          git -C rumiai-tests config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Provision pinned Apache APISIX 3.16 and 3.19 parsers (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker pull apache/apisix@sha256:b921bdef3cfb2ca72e483d643f40e7843683ff8e188984489c2020f17654ee88
          docker pull apache/apisix@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
          docker image inspect --format '{{.Id}}' apache/apisix@sha256:b921bdef3cfb2ca72e483d643f40e7843683ff8e188984489c2020f17654ee88
          docker image inspect --format '{{.Id}}' apache/apisix@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141

      - name: Provision pinned etcd 3.5.21 (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker pull gcr.io/etcd-development/etcd:v3.5.21
          docker image inspect --format '{{.Id}}' gcr.io/etcd-development/etcd:v3.5.21

      - name: Provision real systemd/nginx service scenario (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -d /run/systemd/system
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          # The package may automatically start nginx.service. Keep the host
          # namespace free of unrelated masters during Docker discovery tests.
          sudo systemctl stop nginx.service
          command -v systemd-run
          command -v nginx

      - name: Run scoped APISIX module verification
        shell: bash
        run: |
          cd rumiai-tests
          ./rumiai-validate \
            --no-suite-update \
            --rumiai-os-commit="${{ needs.resolve-product.outputs.rumiai-os-commit }}" \
            rsudo-apisix
      - name: Upload recoverable validation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rsudo-apisix-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rumiai-tests/sessions
            rumiai-tests/validations
          if-no-files-found: ignore
          include-hidden-files: true
