name: mk project dependency development

on:
  push:
    paths:
      - '.github/workflows/mk-project-dependency-development.yml'
  workflow_dispatch:

jobs:
  mk-project-dependency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 6b8393efb844fdeeafe9d7c51ee9cb00029fd654
          path: rumiai-tests

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 78f1ebf6f11d40f2f722ae3f37875118cbda8015
          path: rumiai-os

      - name: Normalize target origin
        shell: sh
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Provision managed Node.js
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          export PATH
          cd rumiai-os
          ./m pkg install nodejs
          nodejs_version="$(./m pkg versions nodejs | sed -n '1p')"
          [ -n "$nodejs_version" ]
          ./m pkg default "$nodejs_version"

      - name: Run mk permanent tests
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          RUMIAI_OS_TARGET="$PWD/rumiai-os"
          export PATH RUMIAI_OS_TARGET
          cd rumiai-tests
          ./rumiai-test rumiai-os/mk/lifecycle.test
          ./rumiai-test rumiai-os/mk/refinement.test
          ./rumiai-test rumiai-os/mk/project-dependency.test
