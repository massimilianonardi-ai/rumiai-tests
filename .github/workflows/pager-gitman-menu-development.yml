name: Pager Gitman Menu development

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pager-gitman-menu-development.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test suite
        uses: actions/checkout@v4
        with:
          ref: 50cf2e4b3da1d204381e9a9093369965c8ab0e1f
          fetch-depth: 1
          path: rumiai-tests

      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 97abcece0dbb9a4ae15fadf452c198e3c57a6037
          fetch-depth: 1
          path: rumiai-os

      - name: Verify exact revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rumiai-tests rev-parse HEAD)" = "50cf2e4b3da1d204381e9a9093369965c8ab0e1f"
          test "$(git -C rumiai-os rev-parse HEAD)" = "97abcece0dbb9a4ae15fadf452c198e3c57a6037"

      - name: Diagnose pager tests directly
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          set +e
          ./tests/rumiai-os/pager/contract.test
          contract_status=$?
          ./tests/rumiai-os/pager/interactive.test
          interactive_status=$?
          echo "contract_status=$contract_status interactive_status=$interactive_status"
          test "$contract_status" -eq 0
          test "$interactive_status" -eq 0

      - name: Run gitman tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./rumiai-test rumiai-os/gitman

      - name: Run menu tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./rumiai-test rumiai-os/menu
