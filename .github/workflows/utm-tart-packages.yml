name: UTM and Tart Apple Silicon packages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/utm-tart-packages.yml
      - tests/external/utm/**
      - tests/external/tart/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-macos-package-install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout test suite at triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: rumiai-tests
          persist-credentials: false

      - name: Checkout exact m runtime revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 673df1a2d5476ad57d54c7bc7e1fc2deeaf16195
          fetch-depth: 1
          path: rumiai-os
          persist-credentials: false

      - name: Normalize target repository origin for suite discovery
        shell: bash
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Identify host and actual catalog revision
        shell: bash
        run: |
          set -eu
          test "$(uname -m)" = arm64
          sw_vers
          uname -a
          echo "suite=$(git -C rumiai-tests rev-parse HEAD)"
          echo "m=$(git -C rumiai-os rev-parse HEAD)"
          git ls-remote https://github.com/massimilianonardi-ai/pkg-catalog.git refs/heads/main

      - name: Install and validate UTM through real m pkg
        shell: bash
        run: |
          cd rumiai-tests
          ./rumiai-test external/utm/install-live.test

      - name: Install and validate Tart through real m pkg
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cd rumiai-tests
          ./rumiai-test external/tart/install-live.test

      - name: Inspect GitHub API rejection and rate-limit metadata
        if: ${{ failure() && !cancelled() }}
        shell: bash
        run: |
          set -eu
          for endpoint in utmapp/UTM/releases/tags/v5.0.8 openai/tart/releases/tags/2.41.1
          do
            headers="$RUNNER_TEMP/api-headers"
            body="$RUNNER_TEMP/api-body"
            curl -sS --max-time 20 -D "$headers" -o "$body" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/$endpoint" || :
            echo "===== $endpoint ====="
            grep -iE '^(HTTP/|x-ratelimit-|retry-after:)' "$headers" || :
            head -c 600 "$body" || :
            printf '\n'
          done

      - name: Print exact test diagnostics
        if: ${{ failure() && !cancelled() }}
        shell: bash
        run: |
          find rumiai-tests/.runs -name '*.log' -type f -print -exec cat {} \;

      - name: Upload test sessions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utm-tart-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rumiai-tests/sessions
            rumiai-tests/.runs
          if-no-files-found: warn
          include-hidden-files: true
