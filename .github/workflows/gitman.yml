name: Gitman development run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gitman.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test suite
        uses: actions/checkout@v4
        with:
          ref: fb1e6eea331081cd484199c9d7250c3aff8067e7
          fetch-depth: 1
          path: rumiai-tests

      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: a8e45d327b218f19cee82c3813bfc75fb5ea64b6
          fetch-depth: 1
          path: rumiai-os

      - name: Verify exact revisions
        shell: bash
        run: |
          set -euo pipefail
          git -C rumiai-tests remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          test "$(git -C rumiai-tests rev-parse HEAD)" = "fb1e6eea331081cd484199c9d7250c3aff8067e7"
          test "$(git -C rumiai-os rev-parse HEAD)" = "a8e45d327b218f19cee82c3813bfc75fb5ea64b6"

      - name: Run gitman tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./rumiai-test rumiai-os/gitman
