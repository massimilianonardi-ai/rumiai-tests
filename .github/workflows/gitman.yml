name: Gitman development run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gitman.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test suite
        uses: actions/checkout@v4
        with:
          ref: e51fe1b1fd3a4e80246e67553baa8858937ebf74
          fetch-depth: 1
          path: rumiai-tests

      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 115ade747d3ae3ad6aebe4003b9cd0596dce4ecd
          fetch-depth: 1
          path: rumiai-os

      - name: Verify exact revisions
        shell: bash
        run: |
          set -euo pipefail
          git -C rumiai-tests remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          test "$(git -C rumiai-tests rev-parse HEAD)" = "e51fe1b1fd3a4e80246e67553baa8858937ebf74"
          test "$(git -C rumiai-os rev-parse HEAD)" = "115ade747d3ae3ad6aebe4003b9cd0596dce4ecd"

      - name: Run gitman interactive test directly
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./tests/rumiai-os/gitman/interactive.test
