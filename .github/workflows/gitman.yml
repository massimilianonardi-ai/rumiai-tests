name: Gitman and menu development run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gitman.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test suite
        uses: actions/checkout@v4
        with:
          ref: 7b9f965c9581a260ff9c9bc4c02a268df5eb37c3
          fetch-depth: 1
          path: rumiai-tests

      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 50b760bd3cfe08922068ceb7d973d7edee12251c
          fetch-depth: 1
          path: rumiai-os

      - name: Verify exact revisions
        shell: bash
        run: |
          set -euo pipefail
          git -C rumiai-tests remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          test "$(git -C rumiai-tests rev-parse HEAD)" = "7b9f965c9581a260ff9c9bc4c02a268df5eb37c3"
          test "$(git -C rumiai-os rev-parse HEAD)" = "50b760bd3cfe08922068ceb7d973d7edee12251c"
          test -z "$(git -C rumiai-tests status --porcelain)"
          test -z "$(git -C rumiai-os status --porcelain)"

      - name: Run gitman tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./rumiai-test rumiai-os/gitman

      - name: Run menu tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./rumiai-test rumiai-os/menu
