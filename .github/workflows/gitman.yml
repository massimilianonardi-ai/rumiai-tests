name: Gitman and menu validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gitman.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation suite
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: rumiai-tests

      - name: Checkout rumiai-os main
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: main
          fetch-depth: 0
          path: rumiai-os

      - name: Normalize branch checkouts
        shell: bash
        run: |
          set -euo pipefail
          git -C rumiai-tests remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          git -C rumiai-tests config user.name "RumiAI Validation"
          git -C rumiai-tests config user.email "validation@rumiai.local"
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          git -C rumiai-os checkout -B main origin/main
          test "$(git -C rumiai-tests symbolic-ref --short HEAD)" = "main"
          test "$(git -C rumiai-os symbolic-ref --short HEAD)" = "main"
          test "$(git -C rumiai-os rev-parse HEAD)" = "50b760bd3cfe08922068ceb7d973d7edee12251c"
          test -z "$(git -C rumiai-tests status --porcelain)"
          test -z "$(git -C rumiai-os status --porcelain)"
          for scope in gitman menu
          do
            awk -F '\t' '$1 == "rumiai-os-commit" && $2 == "50b760bd3cfe08922068ceb7d973d7edee12251c" { found = 1 } END { exit !found }' "rumiai-tests/validation/$scope.conf"
          done

      - name: Validate gitman scope
        shell: bash
        run: |
          cd rumiai-tests
          ./rumiai-validate gitman

      - name: Validate menu scope
        shell: bash
        run: |
          cd rumiai-tests
          ./rumiai-validate menu
