name: mk shared artifacts development

on:
  push:
    paths:
      - '.github/workflows/mk-shared-artifacts-development.yml'
  workflow_dispatch:

jobs:
  mk-shared-artifacts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 609158df06efe08b594be9174ad37a150fa6c5a6
          path: rumiai-tests

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: c3c51e6f070c774c103eeb7f71c759e3ebfda4ec
          path: rumiai-os

      - name: Normalize target origin
        shell: sh
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Provision managed Node.js
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          export PATH
          cd rumiai-os
          ./m pkg install nodejs
          nodejs_version="$(./m pkg versions nodejs | sed -n '1p')"
          [ -n "$nodejs_version" ]
          ./m pkg default "$nodejs_version"

      - name: Run mk shared artifact scope
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          RUMIAI_OS_TARGET="$PWD/rumiai-os"
          export PATH RUMIAI_OS_TARGET
          cd rumiai-tests
          run_test()
          {
            selection=$1
            if ./rumiai-test "$selection"
            then
              return 0
            fi
            find .runs -type f -path "*/logs/$selection" -exec cat {} \; 2>/dev/null || :
            return 1
          }
          run_test rumiai-os/mk/lifecycle.test
          run_test rumiai-os/mk/refinement.test
          run_test rumiai-os/mk/project-dependency.test
          run_test rumiai-os/mk/requirement.test
          run_test rumiai-os/mk/incremental.test
          run_test rumiai-os/mk/inputs.test
          run_test rumiai-os/mk/provider-incremental.test
          run_test rumiai-os/mk/watch.test
          run_test rumiai-os/mk/artifact-restoration.test
          run_test rumiai-os/mk/shared-artifact-concurrency.test
