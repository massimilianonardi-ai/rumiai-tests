name: native-command-provider-discovery

on:
  push:
    branches:
      - m-native-command-tests
    paths:
      - .github/workflows/native-command-provider-discovery.yml
      - tests/rumiai-os/pkg/dependency.test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        revision:
          - published
          - staged
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 12
    steps:
      - name: Checkout exact suite revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: ${{ matrix.revision == 'published' && '02eb2c25221f6d399e6ed22c6d668824fa2a8b9d' || github.sha }}
          path: rumiai-tests
          persist-credentials: false

      - name: Checkout exact runtime revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: ${{ matrix.revision == 'published' && '5ca07aeb26dbc04c0b38998bb05edacd8587a977' || '59d5ec2d78494c126d5c2869b5b01076e735a6ab' }}
          path: rumiai-os
          persist-credentials: false

      - name: Normalize origin and record revisions
        shell: bash
        run: |
          set -euo pipefail
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          echo "revision=${{ matrix.revision }}"
          echo "suite=$(git -C rumiai-tests rev-parse HEAD)"
          echo "runtime=$(git -C rumiai-os rev-parse HEAD)"

      - name: Run exact public dependency resolver test
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          set -euo pipefail
          cd rumiai-tests
          ./rumiai-test rumiai-os/pkg/dependency.test

      - name: Print failing test log
        if: failure()
        shell: bash
        run: |
          find rumiai-tests/.runs -type f -name '*.log' -print 2>/dev/null |
            while IFS= read -r f; do
              case "$f" in *dependency*) echo "---- $f"; tail -n 110 "$f";; esac
            done
          true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-discovery-${{ matrix.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: rumiai-tests/.runs
          include-hidden-files: true
          if-no-files-found: ignore
