name: mk provider incremental development

on:
  push:
    paths:
      - '.github/workflows/mk-provider-incremental-development.yml'
  workflow_dispatch:

jobs:
  mk-provider-incremental:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 248a4b066022d246d692f0d7f8f489126e6b8e74
          path: rumiai-tests

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 5f01f0bccef37020057195c98809ba492f02443c
          path: rumiai-os

      - name: Normalize target origin
        shell: sh
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Provision managed Node.js
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          export PATH
          cd rumiai-os
          attempt=1
          while ! ./m pkg install nodejs
          do
            [ "$attempt" -lt 5 ] || exit 1
            attempt=$((attempt + 1))
            sleep 10
          done
          nodejs_version="$(./m pkg versions nodejs | sed -n '1p')"
          [ -n "$nodejs_version" ]
          ./m pkg default "$nodejs_version"

      - name: Diagnose watch test
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          RUMIAI_OS_TARGET="$PWD/rumiai-os"
          export PATH RUMIAI_OS_TARGET
          cd rumiai-tests
          if ! ./rumiai-test rumiai-os/mk/watch.test
          then
            find .runs -type f -path '*/logs/rumiai-os/mk/watch.test' -exec sh -c 'printf "\n===== %s =====\n" "$1"; cat "$1"' sh {} \; 2>/dev/null || :
            exit 1
          fi
