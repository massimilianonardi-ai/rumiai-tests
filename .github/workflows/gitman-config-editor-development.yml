name: Gitman config editor development

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gitman-config-editor-development.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test suite
        uses: actions/checkout@v4
        with:
          ref: 4562a80fbeea47afc2920c2f2f076cd18a7032af
          fetch-depth: 1
          path: rumiai-tests

      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 9fcbc905e070799caf2ac72552d340621d7e03d8
          fetch-depth: 1
          path: rumiai-os

      - name: Normalize and verify
        shell: bash
        run: |
          set -euo pipefail
          git -C rumiai-tests remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          test "$(git -C rumiai-tests rev-parse HEAD)" = "4562a80fbeea47afc2920c2f2f076cd18a7032af"
          test "$(git -C rumiai-os rev-parse HEAD)" = "9fcbc905e070799caf2ac72552d340621d7e03d8"

      - name: Run gitman tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./rumiai-test rumiai-os/gitman
