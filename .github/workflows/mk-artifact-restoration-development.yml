name: mk artifact restoration development

on:
  push:
    paths:
      - '.github/workflows/mk-artifact-restoration-development.yml'
  workflow_dispatch:

jobs:
  mk-artifact-restoration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 9688e57301045bbbdde447173c43fea53695e844
          path: rumiai-tests

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 533095820ea4f22446510a0f7b338253d908d018
          path: rumiai-os

      - name: Normalize target origin
        shell: sh
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Provision managed Node.js
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          export PATH
          cd rumiai-os
          ./m pkg install nodejs
          nodejs_version="$(./m pkg versions nodejs | sed -n '1p')"
          [ -n "$nodejs_version" ]
          ./m pkg default "$nodejs_version"

      - name: Run mk scope
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          RUMIAI_OS_TARGET="$PWD/rumiai-os"
          export PATH RUMIAI_OS_TARGET
          cd rumiai-tests
          ./rumiai-test rumiai-os/mk/lifecycle.test
          ./rumiai-test rumiai-os/mk/refinement.test
          ./rumiai-test rumiai-os/mk/project-dependency.test
          ./rumiai-test rumiai-os/mk/requirement.test
          ./rumiai-test rumiai-os/mk/incremental.test
          ./rumiai-test rumiai-os/mk/inputs.test
          ./rumiai-test rumiai-os/mk/provider-incremental.test
          ./rumiai-test rumiai-os/mk/watch.test
          ./rumiai-test rumiai-os/mk/artifact-restoration.test
