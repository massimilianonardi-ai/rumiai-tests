name: Menu default Tab validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/menu-default-tab.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation suite
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: rumiai-tests

      - name: Checkout rumiai-os target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          fetch-depth: 0
          path: rumiai-os

      - name: Normalize repository identity
        shell: bash
        run: |
          set -euo pipefail
          git -C rumiai-tests remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          git -C rumiai-tests config user.name "RumiAI Validation"
          git -C rumiai-tests config user.email "validation@rumiai.local"
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          git -C rumiai-tests status --short
          git -C rumiai-os status --short
          awk -F '\t' '$1 == "rumiai-os-commit" && $2 == "34671a5a1e9917fa39e3bbbd4b155590202c9b22" { found = 1 } END { exit !found }' rumiai-tests/validation/menu.conf

      - name: Validate menu scope
        shell: bash
        run: |
          cd rumiai-tests
          ./rumiai-validate menu
