name: Menu default Tab development run

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test suite
        uses: actions/checkout@v4
        with:
          ref: 75a345002e75d53230ca9283c411e4f15a3943f5
          fetch-depth: 1
          path: rumiai-tests

      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 34671a5a1e9917fa39e3bbbd4b155590202c9b22
          fetch-depth: 1
          path: rumiai-os

      - name: Verify exact revisions
        shell: bash
        run: |
          set -euo pipefail
          git -C rumiai-tests remote set-url origin https://github.com/massimilianonardi-ai/rumiai-tests.git
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git
          test "$(git -C rumiai-tests rev-parse HEAD)" = "75a345002e75d53230ca9283c411e4f15a3943f5"
          test "$(git -C rumiai-os rev-parse HEAD)" = "34671a5a1e9917fa39e3bbbd4b155590202c9b22"

      - name: Run menu tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          cd rumiai-tests
          ./rumiai-test rumiai-os/menu
