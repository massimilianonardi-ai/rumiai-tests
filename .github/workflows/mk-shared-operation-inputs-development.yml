name: mk shared operation inputs development

on:
  push:
    paths:
      - '.github/workflows/mk-shared-operation-inputs-development.yml'
  workflow_dispatch:

jobs:
  mk-shared-inputs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 2576ed3b4c594f31a7945e00cd326280107a6916
          path: rumiai-tests

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: d50e5f096ea56c1afd4d19a0ae1361e9ce6326b0
          path: rumiai-os

      - name: Normalize target origin
        shell: sh
        run: git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Check engine syntax
        shell: sh
        run: node --check rumiai-os/lib/sys/js/mk.lib.js

      - name: Provision managed Node.js
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          export PATH
          cd rumiai-os
          ./m pkg install nodejs
          nodejs_version="$(./m pkg versions nodejs | sed -n '1p')"
          [ -n "$nodejs_version" ]
          ./m pkg default "$nodejs_version"

      - name: Run mk tests
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          RUMIAI_OS_TARGET="$PWD/rumiai-os"
          export PATH RUMIAI_OS_TARGET
          cd rumiai-tests
          ./rumiai-test rumiai-os/mk/lifecycle.test
          ./rumiai-test rumiai-os/mk/refinement.test
          ./rumiai-test rumiai-os/mk/project-dependency.test
          ./rumiai-test rumiai-os/mk/requirement.test
          ./rumiai-test rumiai-os/mk/incremental.test
          ./rumiai-test rumiai-os/mk/inputs.test
