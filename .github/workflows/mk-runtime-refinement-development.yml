name: mk-runtime-refinement-development

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mk-runtime-refinement-development.yml

permissions:
  contents: read

jobs:
  targeted-development:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact test-suite revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: rumiai-tests

      - name: Checkout exact rumiai-os revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 926179d3cb8808623dfe6f0bfed1e982dd0763ee
          path: rumiai-os

      - name: Install managed mk runtime
        shell: bash
        run: |
          installed=0
          for attempt in 1 2 3
          do
            if ./rumiai-os/m pkg install nodejs
            then
              installed=1
              break
            fi
          done
          [ "$installed" -eq 1 ]
          ./rumiai-os/m pkg default nodejs

      - name: Diagnose managed runtime entrypoints
        shell: bash
        run: |
          workspace="$(pwd)"
          ./rumiai-os/m pkg default nodejs
          PATH="$workspace/rumiai-os/bin/sys:$PATH"
          export PATH
          "$workspace/rumiai-os/bin/sys/pkg" default nodejs
          cd rumiai-tests
          "$workspace/rumiai-os/m" pkg default nodejs
          "$workspace/rumiai-os/bin/sys/pkg" default nodejs

      - name: Run targeted mk permanent tests
        shell: bash
        run: |
          workspace="$(pwd)"
          RUMIAI_TEST_RUMIAI_OS_ROOT="$workspace/rumiai-os"
          export RUMIAI_TEST_RUMIAI_OS_ROOT
          cd rumiai-tests
          set +e
          ./rumiai-test rumiai-os/mk
          status=$?
          for log in .runs/*/logs/rumiai-os/mk/*.log
          do
            [ -f "$log" ] || continue
            echo "===== $log ====="
            cat "$log"
          done
          exit "$status"
