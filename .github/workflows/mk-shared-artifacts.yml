name: mk-shared-artifacts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mk-shared-artifacts.yml
      - validation/mk-shared-artifacts.conf
      - tests/rumiai-os/mk/shared-artifact-concurrency.test
      - tests/rumiai-os/mk/shared-artifact-maintenance.test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formal-validation:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout current test suite
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: rumiai-tests
          persist-credentials: true

      - name: Checkout product source/update point
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: main
          fetch-depth: 0
          path: rumiai-os
          persist-credentials: true

      - name: Normalize product origin
        shell: bash
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Provision managed Node.js
        shell: bash
        run: |
          cd rumiai-os
          ./m ./bin/sys/pkg install nodejs
          ./m ./bin/sys/pkg default nodejs
          printf '/bin/ext-*/\n' >> .git/info/exclude

      - name: Configure validation evidence author
        shell: bash
        run: |
          git -C rumiai-tests config user.name "github-actions[bot]"
          git -C rumiai-tests config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run mk shared artifact validation
        shell: bash
        run: |
          cd rumiai-tests
          ./rumiai-validate mk-shared-artifacts

      - name: Upload recoverable local evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mk-shared-artifacts-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rumiai-tests/sessions
            rumiai-tests/validations
          if-no-files-found: ignore
          include-hidden-files: true
