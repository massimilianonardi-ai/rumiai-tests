name: enc-library-development

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enc-library-development.yml

permissions:
  contents: read

jobs:
  targeted-development:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact test-suite revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: rumiai-tests

      - name: Checkout exact rumiai-os revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 688379f67ea3a2ddc55f43fbfc5020a07bb3ae0b
          path: rumiai-os

      - name: Normalize product origin
        shell: bash
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Ensure GnuPG OCB support
        shell: bash
        run: |
          if ! command -v gpg >/dev/null 2>&1
          then
            if command -v brew >/dev/null 2>&1
            then
              brew install gnupg
            elif command -v apt-get >/dev/null 2>&1
            then
              sudo apt-get update
              sudo apt-get install -y gnupg
            else
              echo "No supported package manager available for GnuPG" >&2
              exit 1
            fi
          fi

          gpg --version
          gpg --no-options --dump-options |
            grep -E '^--(use-ocb-sym|force-ocb)$'

      - name: Run enc library permanent tests
        shell: bash
        run: |
          workspace="$(pwd)"
          RUMIAI_TEST_RUMIAI_OS_ROOT="$workspace/rumiai-os"
          export RUMIAI_TEST_RUMIAI_OS_ROOT
          cd rumiai-tests
          set +e
          ./rumiai-test rumiai-os/enc
          status=$?
          for log in .runs/*/logs/rumiai-os/enc/*.log
          do
            [ -f "$log" ] || continue
            echo "===== $log ====="
            cat "$log"
          done
          exit "$status"
