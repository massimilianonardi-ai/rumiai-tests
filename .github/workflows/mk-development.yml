name: mk-development-check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mk-development.yml

permissions:
  contents: read

jobs:
  mk-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout test suite revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: rumiai-tests

      - name: Checkout exact rumiai-os revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 6f26a4993337b7020d1ace2d46c827538b6de966
          path: rumiai-os

      - name: Normalize product origin
        shell: bash
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Install managed Node.js runtime
        shell: bash
        run: |
          ./rumiai-os/m pkg install nodejs
          ./rumiai-os/m pkg default nodejs

      - name: Run mk lifecycle permanent test
        shell: bash
        run: |
          cd rumiai-tests
          ./rumiai-test rumiai-os/mk/lifecycle.test
