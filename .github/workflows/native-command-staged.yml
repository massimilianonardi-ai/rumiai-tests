name: native-command-staged

on:
  push:
    branches:
      - m-native-command-tests
    paths:
      - .github/workflows/native-command-staged.yml
      - tests/rumiai-os/command/**
      - tests/rumiai-os/bootstrap/**
      - tests/rumiai-os/pkg-launch/**
      - tests/rumiai-os/pkg-integration/**
      - tests/rumiai-os/pkg/native-launcher-reinstall.test
      - tests/rumiai-os/srv/**
      - lib/rumiai-os-target.lib
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering test revision
        uses: actions/checkout@v4
        with:
          path: rumiai-tests
          persist-credentials: false

      - name: Checkout staged runtime
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 3b5d6019db0cf1b4c419792aef36b4bee12037cb
          path: rumiai-os
          persist-credentials: false

      - name: Checkout staged catalog
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: 893120694670ac91e67353797ca3602d8f2b330b
          path: pkg-catalog
          persist-credentials: false

      - name: Normalize product origin for canonical test discovery
        shell: bash
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Confirm revision-pinned targets
        shell: bash
        run: |
          set -euo pipefail
          echo "suite=$(git -C rumiai-tests rev-parse HEAD)"
          echo "runtime=$(git -C rumiai-os rev-parse HEAD)"
          echo "catalog=$(git -C pkg-catalog rev-parse HEAD)"
          test "$(git -C rumiai-tests rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C rumiai-os rev-parse HEAD)" = "3b5d6019db0cf1b4c419792aef36b4bee12037cb"
          test "$(git -C pkg-catalog rev-parse HEAD)" = "893120694670ac91e67353797ca3602d8f2b330b"

      - name: Check staged catalog shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find pkg-catalog/pkg -type f -path '*/cmd/*' -exec sh -n {} +
          find pkg-catalog/pkg -type f -name env -exec sh -n {} +

      - name: Execute real command and bootstrap tests
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          set -euo pipefail
          cd rumiai-tests
          ./rumiai-test rumiai-os/command
          ./rumiai-test rumiai-os/bootstrap

      - name: Execute real package-launch and integration tests
        if: success() || failure()
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          set -euo pipefail
          cd rumiai-tests
          ./rumiai-test rumiai-os/pkg-launch/contract.test
          ./rumiai-test rumiai-os/pkg-integration/contract.test
          ./rumiai-test rumiai-os/pkg/native-launcher-reinstall.test

      - name: Exercise further migrated public commands
        if: success() || failure()
        shell: bash
        env:
          RUMIAI_TEST_RUMIAI_OS_ROOT: ${{ github.workspace }}/rumiai-os
        run: |
          set -euo pipefail
          cd rumiai-tests
          ./rumiai-test rumiai-os/log
          ./rumiai-test rumiai-os/lang
          ./rumiai-test rumiai-os/jsc/compiler-loader.test
          ./rumiai-test rumiai-os/mk/lifecycle.test
          ./rumiai-test rumiai-os/srv/lifecycle.test
          ./rumiai-test rumiai-os/srv/provider.test

      - name: Print failure diagnostics from test sessions
        if: failure()
        shell: bash
        run: |
          find rumiai-tests/.runs -type f -name '*.log' -print |
            while IFS= read -r log_file; do
              case "$log_file" in
                *library-loading*|*pkg-launch*|*pkg-integration*|*native-launcher-reinstall*|*srv*)
                  printf '\n---- %s ----\n' "$log_file"
                  tail -n 80 "$log_file"
                  ;;
              esac
            done
          true

      - name: Upload runner session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-command-staged-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: rumiai-tests/.runs
          include-hidden-files: true
          if-no-files-found: ignore
