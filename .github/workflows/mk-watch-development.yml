name: mk watch development

on:
  push:
    paths:
      - '.github/workflows/mk-watch-development.yml'
  workflow_dispatch:

jobs:
  mk-watch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-tests
          ref: 5affa386e4c8deff8b6c49cec6c34599aa6d957f
          path: rumiai-tests

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 48bd93440ef78b809b6b952429cc4f8b9ea7a523
          path: rumiai-os

      - name: Normalize target origin
        shell: sh
        run: |
          git -C rumiai-os remote set-url origin https://github.com/massimilianonardi-ai/rumiai-os.git

      - name: Provision managed Node.js
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          export PATH
          cd rumiai-os
          ./m pkg install nodejs
          nodejs_version="$(./m pkg versions nodejs | sed -n '1p')"
          [ -n "$nodejs_version" ]
          ./m pkg default "$nodejs_version"

      - name: Run mk watch test directly
        shell: sh
        run: |
          PATH="$PWD/rumiai-os:$PWD/rumiai-os/bin/sys:$PATH"
          RUMIAI_OS_TARGET="$PWD/rumiai-os"
          export PATH RUMIAI_OS_TARGET
          cd rumiai-tests
          ./tests/rumiai-os/mk/watch.test
